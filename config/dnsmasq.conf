# =============================================================================
# TermuxNetShield — dnsmasq.conf
# =============================================================================
# Arquivo de configuração principal do dnsmasq para bloqueio de anúncios via DNS.
# O dnsmasq resolve consultas DNS e bloqueia domínios de anúncios/rastreadores
# redirecionando-os para 0.0.0.0 (loopback).

# ─── Porta e interface ───────────────────────────────────────────────────────
# Porta não-privilegiada (>= 1024) para funcionar no Termux sem root.
# Para usar a porta 53 (DNS padrão), o Termux precisa de root ou VPN.
port=5353

# Escuta apenas em localhost para segurança
listen-address=127.0.0.1
bind-interfaces

# ─── DNS upstream (para onde encaminhar consultas NÃO bloqueadas) ──────────
# Cloudflare (rápido e privado) + Google (fallback)
server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

# ─── Cache local ─────────────────────────────────────────────────────────────
# Tamanho do cache DNS (em número de entradas)
# Acelera consultas repetidas e reduz tráfego
cache-size=1000

# ─── Logging ─────────────────────────────────────────────────────────────────
# Habilita logs de consulta (usado pelo analyzer.py)
log-queries

# Salva logs em arquivo (criado automaticamente pelo start.sh)
log-facility=~/TermuxNetShield/logs/dnsmasq.log

# Mostra também no terminal (opcional — descomente se quiser ver ao vivo)
#log-facility=-

# ─── Bloqueio de anúncios ───────────────────────────────────────────────────
# Carrega a lista de domínios bloqueados (gerada pelo update-blocklist.sh)
# Cada linha segue o formato:
#   address=/dominio-bloqueado.com/0.0.0.0
conf-file=~/TermuxNetShield/blocklists/ads.conf

# ─── Segurança adicional ─────────────────────────────────────────────────────
# Impede consultas DNS externas (fora da interface local)
local-service

# Não lê /etc/hosts (evita conflitos)
no-hosts

# Responde a consultas inversas com "no such domain"
bogus-priv

# ─── Domínios personalizados (adicione aqui manualmente se quiser) ──────────
# Exemplo: bloqueio manual de um domínio específico
# address=/exemplo-de-anuncio.com/0.0.0.0
# address=/outro-tracker.net/0.0.0.0
